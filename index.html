<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion 藍紫單時鐘與番茄鐘小元件</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violetPrimary: '#7C3AED',
                        violetDark: '#4C1D95',
                        bluePrimary: '#2563EB',
                        glowViolet: 'rgba(124, 58, 237, 0.4)',
                        glowBlue: 'rgba(37, 99, 235, 0.4)',
                    },
                    boxShadow: {
                        'glow': '0 0 25px -5px rgba(139, 92, 246, 0.5), 0 0 10px -5px rgba(59, 130, 246, 0.3)',
                        'clock': 'inset 0 2px 8px rgba(255, 255, 255, 0.15), 0 12px 24px -6px rgba(0, 0, 0, 0.5)',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: transparent;
            user-select: none;
        }

        /* 順暢的指針旋轉動畫 */
        .smooth-hand {
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
            transform-origin: 50% 50%;
        }

        /* 玻璃擬態樣式 */
        .glass-card {
            background: rgba(30, 27, 75, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 250, 0.25);
        }

        .clock-container {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        /* 按鈕平滑過渡 */
        .tab-btn {
            transition: all 0.25s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-3 text-slate-100">

    <!-- 主要 Widget 卡片 -->
    <div class="glass-card w-full max-w-sm rounded-3xl p-4 shadow-glow flex flex-col items-center gap-3 relative overflow-hidden">
        
        <!-- 背景漸層光圈裝飾 -->
        <div class="absolute -top-16 -left-16 w-36 h-36 bg-purple-600/30 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-blue-600/30 rounded-full blur-2xl pointer-events-none"></div>

        <!-- 最頂部：模式切換頁籤 (時區時鐘 vs 番茄鐘) -->
        <div class="z-20 flex items-center justify-between bg-slate-950/80 p-1 rounded-2xl border border-purple-500/30 w-full">
            <button id="tabClock" onclick="switchWidgetMode('clock')" class="tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md">
                <span>🕒</span>
                <span>時區時鐘</span>
            </button>
            <button id="tabPomo" onclick="switchWidgetMode('pomo')" class="tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-purple-300 hover:text-white relative">
                <span>🍅</span>
                <span>番茄鐘</span>
                <!-- 背景運作提示小綠點 -->
                <span id="pomoActiveDot" class="hidden absolute top-1.5 right-2 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            </button>
        </div>

        <!-- ==================== 視圖 1：時區時鐘模式 ==================== -->
        <div id="clockModeView" class="w-full flex flex-col items-center gap-3 z-10">
            <!-- 時鐘主體容器 -->
            <div class="clock-container rounded-2xl p-4 w-full flex flex-col items-center justify-between shadow-inner relative overflow-hidden gap-1">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-600/10 to-purple-600/10 opacity-40 pointer-events-none"></div>

                <!-- 標頭資訊：一鍵切換地點/UTC膠囊按鈕 & 日夜圖示 -->
                <div class="flex items-center justify-between w-full z-10 px-1 text-xs text-purple-300 font-medium">
                    <button id="locationUtcToggle" onclick="toggleLocation()" class="bg-purple-900/80 hover:bg-purple-800 text-purple-200 border border-purple-500/30 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all active:scale-95 flex items-center gap-1 shadow-sm hover:shadow-purple-500/20">
                        🇹🇼 台灣 (UTC+8)
                    </button>
                    <span id="sunMoonIcon" class="text-sm" title="當地球日夜">☀️</span>
                </div>

                <!-- 大日期標題 -->
                <div id="dateDisplay" class="text-xl font-extrabold text-emerald-400 tracking-wider drop-shadow-[0_0_12px_rgba(52,211,153,0.75)] text-center my-1 z-10 transition-colors duration-300">
                    ----年--月--日 星期-
                </div>

                <!-- 類比時鐘本體 -->
                <div class="relative w-40 h-40 my-2 rounded-full bg-slate-900/90 border-2 border-indigo-500/30 shadow-clock flex items-center justify-center z-10">
                    <!-- 時鐘刻度 -->
                    <svg class="absolute inset-0 w-full h-full p-2" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>
                        <g fill="#a78bfa" opacity="0.6">
                            <circle cx="50" cy="8" r="1.5" />
                            <circle cx="92" cy="50" r="1.5" />
                            <circle cx="50" cy="92" r="1.5" />
                            <circle cx="8" cy="50" r="1.5" />
                            <circle cx="71" cy="13.5" r="1" />
                            <circle cx="86.5" cy="29" r="1" />
                            <circle cx="86.5" cy="71" r="1" />
                            <circle cx="71" cy="86.5" r="1" />
                            <circle cx="29" cy="86.5" r="1" />
                            <circle cx="13.5" cy="71" r="1" />
                            <circle cx="13.5" cy="29" r="1" />
                            <circle cx="29" cy="13.5" r="1" />
                        </g>
                        <text x="50" y="20" font-size="7" fill="#c4b5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">12</text>
                        <text x="82" y="50" font-size="7" fill="#c4b5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">3</text>
                        <text x="50" y="81" font-size="7" fill="#c4b5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">6</text>
                        <text x="18" y="50" font-size="7" fill="#c4b5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">9</text>
                    </svg>

                    <!-- 時針 / 分針 / 秒針 -->
                    <div id="hourHand" class="smooth-hand absolute w-1.5 h-11 bg-gradient-to-t from-indigo-300 to-white rounded-full bottom-1/2 left-[calc(50%-3px)] origin-bottom shadow-md z-10"></div>
                    <div id="minuteHand" class="smooth-hand absolute w-1 h-14 bg-gradient-to-t from-purple-400 to-indigo-100 rounded-full bottom-1/2 left-[calc(50%-2px)] origin-bottom shadow-md z-20"></div>
                    <div id="secondHand" class="smooth-hand absolute w-0.5 h-16 bg-pink-500 rounded-full bottom-1/2 left-[calc(50%-1px)] origin-bottom shadow-lg z-30">
                        <div class="w-1.5 h-1.5 bg-pink-400 rounded-full -ml-[2px] -mt-[1px]"></div>
                    </div>
                    <div class="absolute w-2.5 h-2.5 bg-purple-300 rounded-full border-2 border-slate-900 z-40 shadow-sm"></div>
                </div>

                <!-- 數字時間 -->
                <div id="digitalTime" class="text-2xl font-bold tracking-wider text-slate-100 font-mono z-10 mt-1">
                    00:00:00
                </div>
            </div>
        </div>

        <!-- ==================== 視圖 2：專注番茄鐘模式 (極簡版) ==================== -->
        <div id="pomoModeView" class="w-full flex flex-col items-center gap-2.5 z-10 hidden">
            <!-- 番茄鐘計時容器 -->
            <div class="clock-container rounded-2xl p-3.5 w-full flex flex-col items-center justify-between shadow-inner relative overflow-hidden gap-1.5">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-600/10 to-purple-600/10 opacity-40 pointer-events-none"></div>

                <!-- 頂部狀態列 -->
                <div class="flex items-center justify-between w-full z-10 px-1 text-xs text-purple-300 font-medium">
                    <span id="pomoStatusLabel" class="bg-indigo-900/60 px-2 py-0.5 rounded text-[11px] border border-indigo-500/30 text-emerald-400 font-bold">🧠 專注 #1/3</span>
                    <button onclick="toggleAudio()" id="audioBtn" class="text-xs bg-purple-900/40 hover:bg-purple-800/60 px-2 py-0.5 rounded border border-purple-500/20 text-purple-200 transition">🔊 聲音開</button>
                </div>

                <!-- 環形進度倒數計時 -->
                <div class="relative w-36 h-36 my-1 flex items-center justify-center z-10">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="6"/>
                        <circle id="pomoProgressCircle" cx="50" cy="50" r="42" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="0" class="transition-all duration-500"/>
                    </svg>

                    <!-- 中間數位顯示 -->
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <div id="pomoDisplay" class="text-3xl font-extrabold font-mono text-white tracking-tight drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]">
                            25:00
                        </div>
                        <div id="pomoSubLabel" class="text-[10px] text-purple-300 uppercase tracking-widest mt-1">Focus 1/3</div>
                    </div>
                </div>

                <!-- 操作控制按鈕列 (開始/暫停, 跳過, 重置) -->
                <div class="flex items-center justify-center gap-2 z-10 w-full mt-1">
                    <button id="pomoStartBtn" onclick="togglePomoTimer()" class="flex-1 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-900/30 active:scale-95 transition-all flex items-center justify-center gap-1">
                        <span id="pomoStartIcon">▶️</span>
                        <span id="pomoStartText">開始</span>
                    </button>
                    <button onclick="skipPomoStep()" title="跳過此階段" class="px-2.5 py-2 rounded-xl bg-purple-900/50 hover:bg-purple-800 text-purple-200 font-semibold text-xs border border-purple-500/30 active:scale-95 transition-all flex items-center justify-center gap-1">
                        <span>⏭️</span>
                        <span>跳過</span>
                    </button>
                    <button onclick="resetPomoTimer()" title="重置本階段" class="px-2.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-purple-200 font-semibold text-xs border border-purple-500/20 active:scale-95 transition-all flex items-center justify-center gap-1">
                        <span>🔄</span>
                        <span>重置</span>
                    </button>
                </div>

                <!-- 今日完成累積大番茄輪數 -->
                <div class="flex items-center gap-1.5 text-xs text-purple-300/80 z-10 mt-0.5">
                    <span>已完成：</span>
                    <span id="pomoCountDisplay" class="font-bold text-amber-400">0</span>
                    <span>輪完整大番茄 🍅</span>
                </div>
            </div>
        </div>

        <!-- 頁腳說明 -->
        <div class="text-[10px] text-purple-300/40 tracking-widest uppercase mt-0.5 z-10">
            Notion Clock & Pomodoro • Live
        </div>

    </div>

    <script>
        // 時區定義
        const TIMEZONE_TW = 'Asia/Taipei';
        const TIMEZONE_EU = 'Europe/Berlin';

        // 圓環周長常數 (r = 42, 2 * PI * 42)
        const CIRCUMFERENCE = 2 * Math.PI * 42;

        let currentLocation = 'TW';
        let currentWidgetMode = 'clock'; // 'clock' 或 'pomo'

        // 一體化番茄鐘 6 階段自動循環定義
        const POMO_STEPS = [
            { type: 'focus', duration: 25 * 60, title: '🧠 專注 #1/3', sub: 'Focus 1/3', color: '#34d399' },
            { type: 'short', duration: 5 * 60, title: '☕ 短休 #1', sub: 'Short Break 1', color: '#c084fc' },
            { type: 'focus', duration: 25 * 60, title: '🧠 專注 #2/3', sub: 'Focus 2/3', color: '#34d399' },
            { type: 'short', duration: 5 * 60, title: '☕ 短休 #2', sub: 'Short Break 2', color: '#c084fc' },
            { type: 'focus', duration: 25 * 60, title: '🧠 專注 #3/3', sub: 'Focus 3/3', color: '#34d399' },
            { type: 'long', duration: 15 * 60, title: '🌴 深度長休 (完成1輪)', sub: 'Long Break', color: '#60a5fa' }
        ];

        let currentStepIndex = 0;
        let pomoTotalSeconds = POMO_STEPS[0].duration;
        let pomoRemainingSeconds = POMO_STEPS[0].duration;
        let pomoEndTime = null; // 精準時間戳記，防背景休眠與斷點問題
        let pomoTimerInterval = null;
        let isPomoRunning = false;
        let pomoCompletedCount = 0;
        let isAudioEnabled = true;

        // DOM 元素 - 時鐘
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const digitalTime = document.getElementById('digitalTime');
        const dateDisplay = document.getElementById('dateDisplay');
        const locationUtcToggle = document.getElementById('locationUtcToggle');
        const sunMoonIcon = document.getElementById('sunMoonIcon');

        // DOM 元素 - 視圖切換
        const tabClock = document.getElementById('tabClock');
        const tabPomo = document.getElementById('tabPomo');
        const clockModeView = document.getElementById('clockModeView');
        const pomoModeView = document.getElementById('pomoModeView');
        const pomoActiveDot = document.getElementById('pomoActiveDot');

        // DOM 元素 - 番茄鐘
        const pomoDisplay = document.getElementById('pomoDisplay');
        const pomoSubLabel = document.getElementById('pomoSubLabel');
        const pomoStatusLabel = document.getElementById('pomoStatusLabel');
        const pomoStartBtn = document.getElementById('pomoStartBtn');
        const pomoStartIcon = document.getElementById('pomoStartIcon');
        const pomoStartText = document.getElementById('pomoStartText');
        const pomoProgressCircle = document.getElementById('pomoProgressCircle');
        const pomoCountDisplay = document.getElementById('pomoCountDisplay');
        const audioBtn = document.getElementById('audioBtn');

        // 數字補零輔助函式
        function padZero(n) {
            return String(n).padStart(2, '0');
        }

        // 全域 AudioContext 用於突破瀏覽器自動播放限制
        let audioCtx = null;

        function initAudioContext() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.log("AudioContext Init Error:", e);
            }
        }

        // 即時計算與更新時鐘（指標、數字時間、日期與 UTC 標籤）
        function updateClock() {
            const now = new Date();
            const timeZone = currentLocation === 'TW' ? TIMEZONE_TW : TIMEZONE_EU;

            // 取得目標時區之當前時間數字
            const targetDateStr = now.toLocaleString('en-US', { timeZone });
            const targetDate = new Date(targetDateStr);
            const ms = now.getMilliseconds();

            const hours = targetDate.getHours();
            const minutes = targetDate.getMinutes();
            const seconds = targetDate.getSeconds();

            // 時針/分針/秒針的角度計算（秒針採用毫秒實現平滑動態效果）
            const secondDeg = ((seconds + ms / 1000) / 60) * 360;
            const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
            const hourDeg = (((hours % 12) + minutes / 60 + seconds / 3600) / 12) * 360;

            if (hourHand) hourHand.style.transform = `rotate(${hourDeg}deg)`;
            if (minuteHand) minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
            if (secondHand) secondHand.style.transform = `rotate(${secondDeg}deg)`;

            // 數字時間 HH:MM:SS
            if (digitalTime) digitalTime.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;

            // 日期格式化 (年/月/日 星期)
            const year = targetDate.getFullYear();
            const month = padZero(targetDate.getMonth() + 1);
            const day = padZero(targetDate.getDate());
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[targetDate.getDay()];

            if (dateDisplay) {
                dateDisplay.textContent = `${year}年${month}月${day}日 星期${weekday}`;
            }

            // 日夜圖示（早上 6 點至 18 點為太陽，其餘為月亮）
            if (sunMoonIcon) {
                sunMoonIcon.textContent = (hours >= 6 && hours < 18) ? '☀️' : '🌙';
            }

            // 計算當前與 UTC 之時差
            const utcDateStr = now.toLocaleString('en-US', { timeZone: 'UTC' });
            const utcDate = new Date(utcDateStr);
            const offsetHours = Math.round((targetDate - utcDate) / (1000 * 60 * 60));
            const offsetSign = offsetHours >= 0 ? '+' : '';

            if (locationUtcToggle) {
                if (currentLocation === 'TW') {
                    locationUtcToggle.innerHTML = `🇹🇼 台灣 (UTC${offsetSign}${offsetHours})`;
                } else {
                    locationUtcToggle.innerHTML = `🇩🇪 德國 (UTC${offsetSign}${offsetHours})`;
                }
            }
        }

        // 切換地點 (台灣 / 德奧)
        function toggleLocation() {
            initAudioContext();
            currentLocation = currentLocation === 'TW' ? 'EU' : 'TW';

            // 切換日期標題配色（台灣：亮綠，德國：亮紫）
            if (dateDisplay) {
                if (currentLocation === 'TW') {
                    dateDisplay.className = "text-xl font-extrabold text-emerald-400 tracking-wider drop-shadow-[0_0_12px_rgba(52,211,153,0.75)] text-center my-1 z-10 transition-colors duration-300";
                } else {
                    dateDisplay.className = "text-xl font-extrabold text-purple-400 tracking-wider drop-shadow-[0_0_12px_rgba(192,132,252,0.75)] text-center my-1 z-10 transition-colors duration-300";
                }
            }

            updateClock();
        }

        // 切換 Widget 模式 (時鐘 vs 番茄鐘)
        function switchWidgetMode(mode) {
            initAudioContext();
            currentWidgetMode = mode;
            if (mode === 'clock') {
                tabClock.className = "tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md";
                tabPomo.className = "tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-purple-300 hover:text-white relative";
                clockModeView.classList.remove('hidden');
                pomoModeView.classList.add('hidden');
            } else {
                tabPomo.className = "tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md relative";
                tabClock.className = "tab-btn flex-1 py-1.5 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-purple-300 hover:text-white";
                pomoModeView.classList.remove('hidden');
                clockModeView.classList.add('hidden');
            }
        }

        // 套用當前階段 UI
        function applyCurrentStepUI() {
            const step = POMO_STEPS[currentStepIndex];
            pomoTotalSeconds = step.duration;
            pomoStatusLabel.textContent = step.title;
            pomoSubLabel.textContent = step.sub;

            pomoProgressCircle.setAttribute('stroke', step.color);
            pomoDisplay.className = `text-3xl font-extrabold font-mono text-white tracking-tight`;
            
            updatePomoDisplay();
        }

        // 更新番茄鐘畫面顯示與環形進度
        function updatePomoDisplay() {
            const mins = Math.floor(pomoRemainingSeconds / 60);
            const secs = pomoRemainingSeconds % 60;
            pomoDisplay.textContent = `${padZero(mins)}:${padZero(secs)}`;

            // 計算圓環 Stroke Offset
            const progress = pomoTotalSeconds > 0 ? (pomoRemainingSeconds / pomoTotalSeconds) : 0;
            const offset = CIRCUMFERENCE * (1 - progress);
            pomoProgressCircle.style.strokeDashoffset = offset;
        }

        // 儲存狀態至本地端 (防 Notion 重新載入)
        function savePomoState() {
            try {
                const state = {
                    currentStepIndex,
                    pomoRemainingSeconds,
                    pomoEndTime,
                    isPomoRunning,
                    pomoCompletedCount
                };
                localStorage.setItem('notion_pomo_state', JSON.stringify(state));
            } catch(e) {}
        }

        // 載入本地端狀態
        function loadPomoState() {
            try {
                const saved = localStorage.getItem('notion_pomo_state');
                if (saved) {
                    const state = JSON.parse(saved);
                    currentStepIndex = state.currentStepIndex || 0;
                    pomoCompletedCount = state.pomoCompletedCount || 0;
                    pomoCountDisplay.textContent = pomoCompletedCount;

                    if (state.isPomoRunning && state.pomoEndTime) {
                        const now = Date.now();
                        if (state.pomoEndTime > now) {
                            pomoRemainingSeconds = Math.round((state.pomoEndTime - now) / 1000);
                            applyCurrentStepUI();
                            startPomoTimer();
                            return;
                        } else {
                            // 已經超過時間，推進到下一個階段
                            currentStepIndex = (currentStepIndex + 1) % POMO_STEPS.length;
                            pomoRemainingSeconds = POMO_STEPS[currentStepIndex].duration;
                        }
                    } else if (state.pomoRemainingSeconds !== undefined) {
                        pomoRemainingSeconds = state.pomoRemainingSeconds;
                    }
                }
            } catch(e) {}
            applyCurrentStepUI();
        }

        // 開啟/暫停番茄鐘
        function togglePomoTimer() {
            initAudioContext();
            if (isPomoRunning) {
                pausePomoTimer();
            } else {
                startPomoTimer();
            }
        }

        // 核心計時器 Tick
        function tickPomoTimer() {
            if (!isPomoRunning) return;

            const now = Date.now();
            pomoRemainingSeconds = Math.max(0, Math.round((pomoEndTime - now) / 1000));

            updatePomoDisplay();

            if (pomoRemainingSeconds <= 0) {
                onPomoTimerFinished();
            }
        }

        function startPomoTimer() {
            initAudioContext();
            isPomoRunning = true;
            pomoEndTime = Date.now() + pomoRemainingSeconds * 1000;
            savePomoState();

            pomoStartIcon.textContent = "⏸️";
            pomoStartText.textContent = "暫停";
            pomoStartBtn.className = "flex-1 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-900/30 active:scale-95 transition-all flex items-center justify-center gap-1";
            pomoActiveDot.classList.remove('hidden');

            if (pomoTimerInterval) clearInterval(pomoTimerInterval);
            pomoTimerInterval = setInterval(tickPomoTimer, 500);
        }

        function pausePomoTimer() {
            isPomoRunning = false;
            if (pomoEndTime) {
                pomoRemainingSeconds = Math.max(0, Math.round((pomoEndTime - Date.now()) / 1000));
                pomoEndTime = null;
            }
            savePomoState();

            pomoStartIcon.textContent = "▶️";
            pomoStartText.textContent = "繼續";
            pomoStartBtn.className = "flex-1 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-900/30 active:scale-95 transition-all flex items-center justify-center gap-1";
            pomoActiveDot.classList.add('hidden');
            
            if (pomoTimerInterval) clearInterval(pomoTimerInterval);
        }

        function resetPomoTimer() {
            pomoRemainingSeconds = pomoTotalSeconds;
            if (isPomoRunning) {
                pomoEndTime = Date.now() + pomoRemainingSeconds * 1000;
            }
            savePomoState();
            updatePomoDisplay();
        }

        // 跳過當前階段
        function skipPomoStep() {
            initAudioContext();
            advanceToNextStep();
        }

        // 當前階段倒數結束
        function onPomoTimerFinished() {
            playChimeSound();
            advanceToNextStep();
        }

        // 自動推推進下一個階段 (核心修復：正確銜接短休與專注)
        function advanceToNextStep() {
            if (currentStepIndex === POMO_STEPS.length - 1) {
                // 長休結束，代表完成 1 輪大番茄！
                pomoCompletedCount++;
                pomoCountDisplay.textContent = pomoCompletedCount;
                currentStepIndex = 0; // 歸位重頭開始 (專注 #1)
            } else {
                currentStepIndex++; // 順暢推推進下一個階段 (專注 -> 短休)
            }

            const step = POMO_STEPS[currentStepIndex];
            pomoTotalSeconds = step.duration;
            pomoRemainingSeconds = step.duration;

            applyCurrentStepUI();

            if (isPomoRunning) {
                pomoEndTime = Date.now() + pomoRemainingSeconds * 1000;
            }
            savePomoState();
        }

        // 開啟/暫停番茄鐘
        function togglePomoTimer() {
            initAudioContext();
            if (isPomoRunning) {
                pausePomoTimer();
            } else {
                startPomoTimer();
            }
        }

        function startPomoTimer() {
            initAudioContext();
            isPomoRunning = true;
            pomoStartIcon.textContent = "⏸️";
            pomoStartText.textContent = "暫停";
            pomoStartBtn.className = "flex-1 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-900/30 active:scale-95 transition-all flex items-center justify-center gap-1";
            pomoActiveDot.classList.remove('hidden');

            pomoTimerInterval = setInterval(() => {
                if (pomoRemainingSeconds > 0) {
                    pomoRemainingSeconds--;
                    updatePomoDisplay();
                } else {
                    onPomoTimerFinished();
                }
            }, 1000);
        }

        function pausePomoTimer() {
            isPomoRunning = false;
            pomoStartIcon.textContent = "▶️";
            pomoStartText.textContent = "繼續";
            pomoStartBtn.className = "flex-1 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-900/30 active:scale-95 transition-all flex items-center justify-center gap-1";
            pomoActiveDot.classList.add('hidden');
            clearInterval(pomoTimerInterval);
        }

        function resetPomoTimer() {
            pomoRemainingSeconds = pomoTotalSeconds;
            updatePomoDisplay();
        }

        // 跳過當前階段
        function skipPomoStep() {
            initAudioContext();
            advanceToNextStep();
        }

        // 當前階段倒數結束
        function onPomoTimerFinished() {
            playChimeSound();
            advanceToNextStep();
        }

        // 自動推推進下一個階段
        function advanceToNextStep() {
            if (currentStepIndex === POMO_STEPS.length - 1) {
                // 長休結束，代表完成 1 輪大番茄！
                pomoCompletedCount++;
                pomoCountDisplay.textContent = pomoCompletedCount;
                currentStepIndex = 0; // 歸位重頭開始
            } else {
                currentStepIndex++;
            }

            applyCurrentStepUI();
            pomoRemainingSeconds = pomoTotalSeconds;
            updatePomoDisplay();
        }

        // 3秒鐘擬真木雕咕咕鐘音效 (連鳴 3 次 "咕咕! 咕咕! 咕咕!")
        function playChimeSound() {
            if (!isAudioEnabled) return;
            try {
                initAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                
                // 連續鳴叫 3 次，間隔約 0.95 秒，總時長約 2.8 ~ 3.0 秒
                const cuckooTimes = [0.0, 0.95, 1.9];

                cuckooTimes.forEach((startTime) => {
                    // 第一聲 "咕" (較高音，約 659Hz E5，木質三角波)
                    playCuckooNote(659.25, now + startTime, 0.22, 0.5);
                    // 第二聲 "咕" (較低音，約 523Hz C5，木質三角波)
                    playCuckooNote(523.25, now + startTime + 0.22, 0.38, 0.45);
                });
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // 咕咕鳥音符合成輔助函式 (微帶落差的頻率與輕柔包絡)
        function playCuckooNote(freq, startTime, duration, volume) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // 三角波可完美模擬木頭笛聲與鳥鳴韻味
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);
            // 鳥鳴微幅往下滑音
            osc.frequency.exponentialRampToValueAtTime(freq * 0.96, startTime + duration);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration + 0.05);
        }

        function toggleAudio() {
            initAudioContext();
            isAudioEnabled = !isAudioEnabled;
            if (isAudioEnabled) {
                audioBtn.textContent = "🔊 聲音開";
                audioBtn.className = "text-xs bg-purple-900/40 hover:bg-purple-800/60 px-2 py-0.5 rounded border border-purple-500/20 text-purple-200 transition";
            } else {
                audioBtn.textContent = "🔇 靜音";
                audioBtn.className = "text-xs bg-slate-800/60 hover:bg-slate-700 px-2 py-0.5 rounded border border-slate-600 text-slate-400 transition";
            }
        }

        // 初始化與高頻定時器
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 50);
            
            // 載入防重置的番茄鐘狀態
            loadPomoState();

            // 監聽點擊/觸控以啟動 AudioContext 授權
            window.addEventListener('click', initAudioContext, { once: false });
            window.addEventListener('touchstart', initAudioContext, { once: false });
        };
    </script>
</body>
